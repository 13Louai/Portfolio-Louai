<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louai Entamene — Développeur logiciel</title>
  <meta name="description" content="Portfolio de Louai Entamene, développeur logiciel à la recherche d’une alternance : SaaS, application mobile, bots autonomes et jeux multijoueurs.">
  <meta name="theme-color" content="#141417">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141417'/%3E%3Cpath d='M9 10l6 6-6 6' fill='none' stroke='%237aa2f7' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h7' stroke='%23e8eaf0' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Appliqué avant l'affichage pour éviter un flash de la mauvaise couleur.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <div class="ide">
    <!-- Barre de titre -->
    <header class="titlebar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <button class="tb-btn burger" id="burger" type="button" aria-label="Ouvrir l’explorateur" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="mobile-path" id="mobile-path">~/accueil</span>
      <button class="tb-btn" id="search-btn-m" type="button" aria-label="Rechercher un fichier ou une commande">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      </button>
      <button class="search" id="search-btn" type="button" aria-label="Rechercher un fichier ou une commande (Ctrl+P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <span class="search-txt">louai-entamene — portfolio</span>
        <kbd>Ctrl P</kbd>
      </button>
    </header>

    <div class="workbench">
      <!-- Barre d'activité -->
      <nav class="activitybar" aria-label="Vues">
        <button type="button" data-vue="explorer" aria-pressed="true" title="Explorateur">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <span class="sr-only">Explorateur</span>
        </button>
        <button type="button" id="act-search" title="Rechercher (Ctrl+P)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          <span class="sr-only">Rechercher</span>
        </button>
        <button type="button" data-vue="git" aria-pressed="false" title="Contrôle de code source">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 8.2v7.6M18 10.2c0 4-6 3-11 6"/></svg>
          <span class="badge" id="git-badge"></span>
          <span class="sr-only">Contrôle de code source</span>
        </button>
        <button type="button" id="act-terminal" aria-pressed="false" title="Terminal (Ctrl+`)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 4 4-4 4M12 16h7"/></svg>
          <span class="sr-only">Terminal</span>
        </button>
        <span class="grow"></span>
        <button type="button" class="theme-toggle" title="Changer de thème">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr-only">Changer de thème</span>
        </button>
      </nav>

      <!-- Barre latérale -->
      <aside class="sidebar" id="sidebar" aria-label="Fichiers du portfolio">
        <div class="side-view" id="vue-explorer">
          <p class="side-title">Explorateur</p>
          <p class="side-section">Portfolio</p>
          <ul class="tree" id="tree"></ul>
        </div>
        <div class="side-view" id="vue-git" hidden>
          <p class="side-title">Contrôle de code source</p>
          <p class="side-section" id="git-head"></p>
          <ul class="git-list" id="git-list"></ul>
        </div>
        <p class="side-foot"><span class="dot-ok" aria-hidden="true"></span> Recherche une alternance</p>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <!-- Éditeur -->
      <div class="editor">
        <div class="tabs" id="tabs"></div>
        <p class="crumbs" id="crumbs"></p>
        <main class="content" id="contenu" tabindex="-1"></main>

        <section class="terminal" id="terminal" aria-label="Terminal" hidden>
          <div class="term-head">
            <span>Terminal</span>
            <button type="button" class="term-close" id="term-close" aria-label="Fermer le terminal">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="term-body" id="term-body">
            <div id="term-out" aria-live="polite"></div>
            <form class="term-line" id="term-form">
              <label for="term-in"><span class="t-user">louai@portfolio</span>:<span class="t-path">~</span>$</label>
              <input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false">
            </form>
          </div>
        </section>
      </div>
    </div>

    <!-- Barre d'état -->
    <footer class="statusbar">
      <button type="button" class="sb" id="sb-git">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 8.2v7.6M18 10.2c0 4-6 3-11 6"/></svg>
        main
      </button>
      <span class="sb sb-wide"><span class="dot-ok" aria-hidden="true"></span> alternance recherchée</span>
      <span class="grow"></span>
      <span class="sb sb-wide" id="sb-lang"></span>
      <span class="sb sb-wide">UTF-8</span>
      <button type="button" class="sb sb-wide" id="sb-term">Terminal</button>
      <button type="button" class="sb theme-toggle" id="sb-theme"></button>
      <span class="sb" id="sb-clock"></span>
    </footer>
  </div>

  <!-- Palette de commandes -->
  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Aller à un fichier ou lancer une commande">
      <input id="palette-in" type="text" placeholder="Rechercher un fichier, ou « > » pour les commandes" autocomplete="off"
             role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
      <ul id="palette-list" role="listbox" aria-label="Résultats"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <noscript>
    <p class="noscript">Ce portfolio a besoin de JavaScript. Mes projets sont aussi sur <a href="https://github.com/13Louai">GitHub</a>.</p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/activite.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
